[project]
name = "bitwarden-decrypt"
version = "0.1.0"
description = "Decrypt an encrypted Bitwarden password export JSON"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=3.3.2",
    "argon2-cffi>=18.2.0",
]
authors = [
    {name = "Gurpreet Kang"}
]
license = {text = "GPL-3.0-only"}

[project.scripts]
bitwarden-decrypt = "bitwarden_decrypt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "ISC",
    "N",
    "PL",
    "RUF",
    "SIM",
    "TRY",
    "UP",
    "W",
    "ERA"
]
ignore = [
    "PLR0911",  # Too many return statements
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value used in comparison
    "E501",     # Line too long (let ruff format take care of this)
    "TRY003",   # Long messages outside exception class
    "SIM108",   # Use ternary operation instead of if-else block
    "ISC001",   # Incompatible with the formatter
    "PLW2901",  # For loop varaibles overwritten

    # This project uses camelCase for everything, so we disable these
    "N802",     # Function name should be lowercase
    "N803",     # Argument name should be lowercase
    "N806",     # Variable in function should be lowercase
]

[tool.pyright]
# Ruff also handles this, and it needs to be enabled there for fixAll to fix it,
# so we disable it here to avoid duplicate errors
reportUnusedImport = false
typeCheckingMode = "basic"
